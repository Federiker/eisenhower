[package]
name = "eisenhower_desktop"
description = "Eisenhower as a desktop app: any view's document created, opened and saved on disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The app as a library (its window and the documents it is given), which the program runs and the tests test.
# Not `eisenhower_desktop`, which the program is: on Windows the two would write the same .pdb.
[lib]
name = "eisenhower_desktop_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-eisenhower.workspace = true
tauri-plugin-single-instance.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
# The mock runtime, for the documents given to the app.
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
