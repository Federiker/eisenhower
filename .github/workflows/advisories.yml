name: Advisories

# Known vulnerabilities in the npm packages (bun audit) and the Rust crates
# (cargo-deny, RustSec), only when started by hand (`mise run audit` looks for
# them locally too). Kept out of the Checks workflow so a new advisory never
# fails an unrelated run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: cargo deny check advisories
