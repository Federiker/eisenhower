[package]
name = "tauri-plugin-eisenhower"
description = "Eisenhower's Tauri plugin: documents read and written on disk with a hash guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "planning", "documents", "files"]
categories = ["gui", "filesystem"]
# On crates.io, unlike the workspace's other crates (owner decision, 27 October 2026; see
# docs/development.md, decision 11): `mise run publish` publishes it.
publish = true
# Tauri passes the plugin's permissions to the app's build through this.
links = "tauri-plugin-eisenhower"

[lib]
name = "tauri_plugin_eisenhower"

[dependencies]
serde.workspace = true
sha2.workspace = true
tauri.workspace = true
tempfile.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The mock runtime, for the commands' tests.
tauri = { workspace = true, features = ["test"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[lints]
workspace = true
