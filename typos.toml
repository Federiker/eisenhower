# typos checks spelling in code and docs, in UK English (owner decision, 27 October 2026; see
# docs/development.md, decision 12). Every allowed word below says why it is allowed.

[default]
locale = "en-gb"

[default.extend-words]
# Names other software fixes: serde's Serialize, CSS and the DOM (`color`, `center`, `behavior`), HTML's
# <dialog>, Bun's `catalog`, GitHub's upload-artifact action, the sha2 crate's `finalize`, the DOM's
# `Intl.DateTimeFormat` options and Tauri's `maximized`.
serialize = "serialize"
serializer = "serializer"
serializes = "serializes"
normalize = "normalize"
normalized = "normalized"
color = "color"
colors = "colors"
center = "center"
behavior = "behavior"
dialog = "dialog"
catalog = "catalog"
artifact = "artifact"
finalize = "finalize"
maximized = "maximized"

[files]
extend-exclude = [
  "*.lock",
  "LICENSE",
  "**/tests/fixtures/",
  "**/licences/",
  "**/notices/",
  # Tauri writes the plugin's permission reference and schema (crates/tauri-plugin/build.rs).
  "crates/tauri-plugin/permissions/autogenerated/",
  "crates/tauri-plugin/permissions/schemas/",
]
